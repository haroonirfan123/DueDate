<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DueDate{% endblock %}</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --brand:#4f46e5; --bg:#f5f6fa; --card:#fff; --line:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
    nav { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
    nav a.logo { font-weight:700; font-size:1.25rem; color:var(--brand); text-decoration:none; }
    nav .links a { margin-left:16px; color:var(--ink); text-decoration:none; }
    main { max-width:820px; margin:32px auto; padding:0 20px; }
    h1 { margin-top:0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:14px; }
    label { display:block; font-weight:600; margin:14px 0 4px; }
    input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    .btn { display:inline-block; background:var(--brand); color:#fff; border:0; padding:10px 18px; border-radius:8px; font:inherit; cursor:pointer; text-decoration:none; }
    .btn.secondary { background:#e5e7eb; color:var(--ink); }
    .btn.danger { background:#dc2626; }
    .flash { padding:12px 16px; border-radius:8px; margin-bottom:16px; }
    .flash.success { background:#dcfce7; color:#166534; }
    .flash.error { background:#fee2e2; color:#991b1b; }
    .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
    .muted { color:var(--muted); font-size:.9rem; }
    .tag { font-size:.75rem; padding:2px 8px; border-radius:99px; background:#eef2ff; color:var(--brand); font-weight:600; }
    .tag.High { background:#fee2e2; color:#991b1b; }
    .tag.Medium { background:#fef3c7; color:#92400e; }
    .done .title { text-decoration:line-through; color:var(--muted); }
    .actions { display:flex; gap:8px; }
    .actions form { margin:0; }
    .quote { font-style:italic; color:var(--muted); margin-bottom:20px; }
    .hero { text-align:center; padding:60px 0; }
    .hero h1 { font-size:2.6rem; margin-bottom:8px; }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="{{ url_for('index') }}">DueDate</a>
    <div class="links">
      {% if session.user_id %}
        <span class="muted">Hi, {{ session.name }}</span>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Log out</a>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('signup') }}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
