{% extends "base.html" %}
{% block title %}{{ 'Edit' if a else 'New' }} assignment · DueDate{% endblock %}
{% block content %}
<h1>{{ 'Edit assignment' if a else 'New assignment' }}</h1>
<form method="POST" class="card">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" value="{{ a.title if a else '' }}" required>

  <label for="course">Course</label>
  <input type="text" id="course" name="course" value="{{ a.course if a else '' }}" required>

  <label for="due_date">Due date</label>
  <input type="date" id="due_date" name="due_date" value="{{ a.due_date if a else '' }}" required>

  <label for="priority">Priority</label>
  <select id="priority" name="priority" required>
    {% for p in priorities %}
      <option value="{{ p }}" {% if (a and a.priority == p) or (not a and p == 'Medium') %}selected{% endif %}>{{ p }}</option>
    {% endfor %}
  </select>

  <label for="notes">Notes (optional)</label>
  <textarea id="notes" name="notes" rows="3">{{ a.notes if a else '' }}</textarea>

  {% if a %}
  <label><input type="checkbox" name="done" style="width:auto" {% if a.done %}checked{% endif %}> Mark as completed</label>
  {% endif %}

  <p><button class="btn" type="submit">Save</button>
     <a class="btn secondary" href="{{ url_for('dashboard') }}">Cancel</a></p>
</form>
{% endblock %}
